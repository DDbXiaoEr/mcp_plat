syntax = "proto3";

package plugin;

option go_package = "mcp_plat-console/plugin";

service AccessKeyService {
  rpc Validate(ValidateRequest) returns (ValidateResponse);
}

message ValidateRequest {
  string access_key = 1;
  string request_path = 2;
  string server_id = 3;
}

message ValidateResponse {
  bool valid = 1;
  uint64 user_id = 2;
  string role = 3;
  string message = 4;
}
