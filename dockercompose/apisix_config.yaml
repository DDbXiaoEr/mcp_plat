#
# ============================================================
# APISIX 示例配置（部署 apisix-go-runner 插件）
# admin key 使用 changeme 占位，生产环境必须更换！
# ============================================================
#
deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  admin:
    enable_admin_ui: true
    allow_admin:
      - 0.0.0.0/0  # TODO: 生产环境请限制为可信 IP 段，如 192.168.0.0/16
    admin_key:
      - name: admin
        key: b6899497f05e634029031f18ce1765ad17c604141ae053ec
        role: admin
  etcd:
    host:
      - http://${{ETCD_HOST:=etcd}}:2379

apisix:
  # APISIX 3.x：node_listen 仅支持数字或 {ip, port} 对象，
  # 字符串项（如 2.x 的 "443:ssl"）会被静默忽略，HTTPS 需单独在 ssl.listen 声明。
  node_listen:
    - 80
  ssl:
    listen:
      - port: 443

# APISIX 以子进程方式启动 go plugin runner，并自动管理其生命周期
# 注意：该路径必须与 apisix 镜像（mcp_plat_apisix）内部 go-runner 的实际安装路径一致，否则容器内会启动失败
ext-plugin:
  cmd: ["/opt/mcp_plat/bin/apisix-go-runner"]
