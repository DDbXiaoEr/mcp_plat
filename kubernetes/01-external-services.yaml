# ============================================================
# 外部服务（PostgreSQL / ClickHouse）
#
# 以下服务不在此集群内运行，通过 ClusterIP Service + 手动 Endpoints
# 将内部 DNS 名称映射到外部固定 IP。
# ============================================================

# --- PostgreSQL (192.168.31.233:5432) ---
apiVersion: v1
kind: Service
metadata:
  name: mainpostgres
  namespace: mcp-plat
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Endpoints
metadata:
  name: mainpostgres
  namespace: mcp-plat
subsets:
  - addresses:
      - ip: 192.168.31.233
    ports:
      - name: postgres
        port: 5432
---
# --- Redis (192.168.31.233:6379) ---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: mcp-plat
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Endpoints
metadata:
  name: redis
  namespace: mcp-plat
subsets:
  - addresses:
      - ip: 192.168.31.233
    ports:
      - name: redis
        port: 6379
---
# --- ClickHouse (192.168.31.233:9000) ---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: mcp-plat
spec:
  type: ClusterIP
  ports:
    - name: clickhouse
      port: 9000
      targetPort: 9000
---
apiVersion: v1
kind: Endpoints
metadata:
  name: clickhouse
  namespace: mcp-plat
subsets:
  - addresses:
      - ip: 192.168.31.233
    ports:
      - name: clickhouse
        port: 9000

