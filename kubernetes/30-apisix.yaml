# ============================================================
# apisix
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: apisix
  namespace: mcp-plat
  labels:
    app: apisix
spec:
  type: ClusterIP
  selector:
    app: apisix
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apisix
  namespace: mcp-plat
  labels:
    app: apisix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apisix
  template:
    metadata:
      labels:
        app: apisix
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: apisix
          image: mcp_plat_apisix:64c736b
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            capabilities:
              add:
                - NET_BIND_SERVICE
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
          volumeMounts:
            - name: apisix-config
              mountPath: /usr/local/apisix/conf/config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: apisix-config
          configMap:
            name: apisix-config
