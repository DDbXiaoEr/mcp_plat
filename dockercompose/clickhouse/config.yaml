# ============================================================
# mcp_plat-console 主程序配置文件（审计日志存储：ClickHouse）
# ============================================================

# 主程序数据库（用户、角色、AccessKey、服务器、系统设置等）
database:
  type: postgres
  postgres:
    host: mainpostgres
    port: 5432
    user: root
    password: 123456
    dbname: mcp_plat_db

# ============================================================
# 审计日志存储（与 audit_log_server.yml 保持一致）
# ============================================================
audit_log_db:
  type: clickhouse
  clickhouse:
    addr: clickhouse:9000
    user: default
    password: ""
    db: audit_logs
    table: audit_logs
    engine: merge_tree               # 单机：merge_tree；集群：replicated_merge_tree
    cluster: ""                      # replicated_merge_tree 时必填
    ttl_days: 90                     # 数据保留天数（ClickHouse 原生 TTL，自动清理）

# Redis（用户 Cookie Session 存储）
redis:
  addr: redis:6379
  password: ""
  db: 0

session:
  cookie_name: mcp_session
  max_age: 86400
  secure: false
  same_site: lax

# 密钥需至少 32 字符随机值，生产环境建议通过环境变量注入
access_key_secret: 093e4f7d88cf7c8fa98244574dac873399ca3cf94f7128c1fb8f8f2789a8b132

# HTTP 监听端口
server_port: 8080

admin:
  enabled: true
  username: admin
  password: admin123
