# ============================================================
# audit-log-server 配置文件
# 复制为 audit_log_server.yml 后启动
# ============================================================

# 密钥需至少 32 字符随机值，需与主程序保持一致
access_key_secret: changeme-another-random-32-char-string

# gRPC 监听地址
grpc_addr: "0.0.0.0:9091"

# 审计日志存储（与主程序 config.yaml 中 audit_log_db 保持一致）
database:
  type: clickhouse
  clickhouse:
    addr: 127.0.0.1:9000
    user: default
    password: ""
    db: default
    table: audit_logs
    engine: merge_tree               # 单机部署
    cluster: ""
    ttl_days: 90
