# ============================================================
# 主程序数据库（用户、角色、AccessKey、服务器、系统设置等）
# ============================================================
database:
  type: postgres
  postgres:
    host: 127.0.0.1
    port: 5432
    user: root
    password: 123456
    dbname: mcp_plat_db

# ============================================================
# 审计日志存储（与 audit-log-server 共用，写入/查询目标一致）
# ============================================================
audit_log_db:
  type: clickhouse
  clickhouse:
    addr: 127.0.0.1:9000
    user: default
    password: ""
    db: default
    table: audit_logs
    engine: merge_tree               # 单机部署
    cluster: ""
    ttl_days: 90

# 密钥需至少 32 字符随机值，生产环境建议通过环境变量注入
jwt_secret: changeme-please-generate-a-random-32-char-string
access_key_secret: changeme-another-random-32-char-string
server_port: 8080

admin:
  username: admin
  password: admin123
