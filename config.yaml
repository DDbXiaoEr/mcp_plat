# ============================================================
# 主程序数据库（用户、角色、AccessKey、服务器、系统设置等）
# ============================================================
database:
  type: postgres
  postgres:
    host: localhost
    port: 5432
    user: root
    password: 123456
    dbname: mcp_platform

# ============================================================
# 审计日志数据库（与 audit-log-server 共用）
# type 可选：
#   - postgres / sqlite : 关系库存储（低/中量级）
#   - clickhouse        : ClickHouse 时序存储（高量级），读取端也必须保持一致
# ============================================================
audit_log_db:
  type: postgres
  postgres:
    host: localhost
    port: 5432
    user: root
    password: 123456
    dbname: mcp_history_db
  # 切换为 ClickHouse 时，请启用下方配置并删除上方 postgres 配置：
  # type: clickhouse
  # clickhouse:
  #   addr: 127.0.0.1:9000
  #   user: default
  #   password: ""
  #   db: mcp_platform
  #   table: audit_logs
  #   engine: merge_tree            # 单机：merge_tree；集群：replicated_merge_tree
  #   cluster: ""                   # replicated_merge_tree 时必填，如 mcp_platform_cluster
  #   ttl_days: 90                  # 数据保留天数

# 密钥需至少 32 字符随机值，生产环境建议通过环境变量注入
jwt_secret: changeme-please-generate-a-random-32-char-string
access_key_secret: changeme-another-random-32-char-string
server_port: 8080

admin:
  username: admin
  password: admin123
